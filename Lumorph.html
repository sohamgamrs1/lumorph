<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Lumorph — lookmaxxing, free for everyone</title>
<meta name="description" content="Lumorph scores your face on device, builds a routine around your skin and tracks what actually changes. Free, no subscription, no AI bills." />
<meta name="theme-color" content="#07070A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lumorph" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Lumorph — design system
   Dark-first, gold on ink. Every animation runs on transform
   and opacity only, so it stays on the compositor at 60fps.
   ============================================================ */

:root {
  --ink: #F6F1E7;
  --muted: #9B968C;
  --faint: #6C6862;
  --bg: #07070A;
  --bg-2: #0B0B10;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.075);
  --line: rgba(255, 255, 255, 0.085);
  --line-strong: rgba(255, 255, 255, 0.16);
  --gold: #EAD5A2;
  --gold-2: #C6A167;
  --gold-3: #8C6B33;
  --gold-soft: rgba(234, 213, 162, 0.13);
  --danger: #E4796E;
  --good: #8FCBA4;

  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.55, 0, 0.8, 0.2);
  --spring: cubic-bezier(0.34, 1.4, 0.5, 1);

  --t-fast: 180ms;
  --t-mid: 320ms;
  --t-slow: 560ms;

  --pad: 22px;
  --tabbar: 74px;

  --serif: "Instrument Serif", "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

[data-theme="light"] {
  --ink: #17161A;
  --muted: #6B6660;
  --faint: #8E8880;
  --bg: #F6F3EC;
  --bg-2: #FFFFFF;
  --surface: rgba(23, 22, 26, 0.045);
  --surface-2: rgba(23, 22, 26, 0.075);
  --line: rgba(23, 22, 26, 0.10);
  --line-strong: rgba(23, 22, 26, 0.2);
  --gold: #8A6A2E;
  --gold-2: #A8873F;
  --gold-3: #C9AC6C;
  --gold-soft: rgba(138, 106, 46, 0.12);
  --danger: #C0513F;
  --good: #3E8A5C;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body { display: flex; justify-content: center; }

button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
::selection { background: var(--gold-soft); }

/* ---------- shell ---------- */
.app {
  position: relative;
  width: 100%;
  max-width: 460px;
  min-height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}

@media (min-width: 520px) {
  body { background: radial-gradient(120% 80% at 50% 0%, #101014 0%, #050506 70%); }
  .app {
    min-height: 100dvh;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 40px 120px rgba(0, 0, 0, 0.6);
  }
}

/* slow drifting aurora — one transform animation, no repaint */
.aurora {
  position: fixed;
  inset: -30% -30% auto -30%;
  height: 70vh;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(50% 50% at 30% 20%, rgba(198, 161, 103, 0.22), transparent 70%),
    radial-gradient(45% 45% at 75% 10%, rgba(120, 96, 200, 0.16), transparent 72%),
    radial-gradient(40% 40% at 50% 45%, rgba(234, 213, 162, 0.10), transparent 70%);
  filter: blur(18px);
  will-change: transform;
  animation: drift 26s var(--ease) infinite alternate;
}
@keyframes drift {
  from { transform: translate3d(-2%, 0, 0) scale(1); }
  to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
}

/* fine film grain, static, sits above the gradient only */
.grain {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}

/* ---------- typography ---------- */
.display {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.02;
  margin: 0;
}
.display.xl { font-size: 46px; }
.display.lg { font-size: 36px; }
.display.md { font-size: 27px; }
.display.sm { font-size: 21px; }
.display em { font-style: italic; }

.eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.lede { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; max-width: 34ch; }
.small { font-size: 12.5px; color: var(--muted); }
.tiny { font-size: 11px; color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- view scaffolding ---------- */
#view {
  position: relative;
  z-index: 2;
  min-height: 100dvh;
  padding: 0 var(--pad) calc(var(--tabbar) + 34px);
  will-change: transform, opacity;
}
#view.no-tabs { padding-bottom: 40px; }
#view.enter { animation: viewIn var(--t-mid) var(--ease) both; }
#view.leave { animation: viewOut 160ms var(--ease-in) both; }
@keyframes viewIn {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to   { opacity: 1; transform: none; }
}
@keyframes viewOut {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate3d(0, -6px, 0); }
}

.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-10 { gap: 10px; }
.gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-20 { gap: 20px; }
.grow { flex: 1; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.mt-20 { margin-top: 20px; } .mt-28 { margin-top: 28px; } .mt-36 { margin-top: 36px; }

/* staggered entrance */
.rise {
  opacity: 0;
  transform: translate3d(0, 16px, 0);
  transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
  transition-delay: calc(var(--i, 0) * 55ms);
  will-change: transform, opacity;
}
.rise.in { opacity: 1; transform: none; }

/* ---------- top bar ---------- */
.topbar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(26px + env(safe-area-inset-top)) 0 12px;
  min-height: 56px;
}
.icon-btn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  transition: transform var(--t-fast) var(--spring), background var(--t-fast) var(--ease);
}
.icon-btn:active { transform: scale(0.9); background: var(--surface-2); }
.icon-btn.ghost { background: none; border-color: transparent; }
.brandmark {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 9px;
}
.orb-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF4D8, var(--gold) 45%, var(--gold-2) 80%);
  box-shadow: 0 0 12px rgba(234, 213, 162, 0.55);
}

/* ---------- cards ---------- */
.card {
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  overflow: hidden;
}
[data-theme="light"] .card {
  background: linear-gradient(180deg, #FFFFFF, #FBFAF6);
  box-shadow: 0 1px 2px rgba(23,22,26,0.04), 0 10px 30px rgba(23,22,26,0.05);
}
.card.tight { padding: 14px; }
.card.flat { background: var(--surface); }
.card.gold {
  background:
    radial-gradient(120% 120% at 12% 0%, rgba(234, 213, 162, 0.16), transparent 58%),
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border-color: rgba(234, 213, 162, 0.22);
}
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

/* ---------- buttons ---------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  height: 54px;
  padding: 0 20px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  transition: transform 140ms var(--spring), background var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
  will-change: transform;
}
.btn:active { transform: scale(0.975); }
.btn.primary {
  background: linear-gradient(180deg, #FFF6E2, var(--gold) 55%, var(--gold-2));
  border-color: rgba(255, 255, 255, 0.4);
  color: #171308;
  box-shadow: 0 10px 30px -12px rgba(234, 213, 162, 0.55);
}
.btn.primary:active { box-shadow: 0 4px 16px -10px rgba(234, 213, 162, 0.5); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.small { height: 40px; font-size: 13.5px; width: auto; padding: 0 16px; }
.btn.danger { color: var(--danger); border-color: rgba(228, 121, 110, 0.3); }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.btn .spin {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.25); border-top-color: #171308;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- chips / pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--ink);
  white-space: nowrap;
}
.pill.gold { border-color: rgba(234,213,162,0.3); background: var(--gold-soft); color: var(--gold); }
.pill.plain { background: none; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.pill.tap { transition: transform 140ms var(--spring), background var(--t-fast) var(--ease); }
.pill.tap:active { transform: scale(0.94); }

/* ---------- tabs (segmented) ---------- */
.segmented {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.segmented .thumb {
  position: absolute;
  top: 4px; left: 4px; bottom: 4px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
  border: 1px solid var(--line-strong);
  transition: transform var(--t-mid) var(--spring), width var(--t-mid) var(--spring);
  will-change: transform, width;
}
.segmented button {
  position: relative; z-index: 1;
  height: 38px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  transition: color var(--t-fast) var(--ease);
}
.segmented button[aria-selected="true"] { color: var(--ink); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 50%;
  transform: translate3d(-50%, 0, 0);
  width: 100%;
  max-width: 460px;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(180deg, rgba(7,7,10,0) 0%, rgba(7,7,10,0.86) 42%, var(--bg) 100%);
}
[data-theme="light"] .tabbar {
  background: linear-gradient(180deg, rgba(246,243,236,0) 0%, rgba(246,243,236,0.9) 42%, var(--bg) 100%);
}
.tabbar .inner {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  height: 60px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(20, 20, 26, 0.82);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: 0 18px 40px -20px rgba(0,0,0,0.9);
}
[data-theme="light"] .tabbar .inner { background: rgba(255,255,255,0.85); }
.tabbar .glow {
  position: absolute;
  top: 6px; bottom: 6px;
  border-radius: 999px;
  background: var(--gold-soft);
  border: 1px solid rgba(234,213,162,0.22);
  transition: transform var(--t-mid) var(--spring), width var(--t-mid) var(--spring);
  will-change: transform, width;
}
.tabbar button {
  position: relative;
  z-index: 1;
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: color var(--t-fast) var(--ease), transform 140ms var(--spring);
}
.tabbar button svg { width: 20px; height: 20px; }
.tabbar button.active { color: var(--gold); }
.tabbar button:active { transform: scale(0.92); }
.tabbar .scan-fab {
  flex: 0 0 auto;
  width: 78px;
  height: 46px;
  margin: 0 4px;
  border-radius: 999px;
  background: linear-gradient(180deg, #FFF6E2, var(--gold) 55%, var(--gold-2));
  color: #171308;
  flex-direction: row;
  gap: 7px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 10px 24px -12px rgba(234,213,162,0.7);
}
.tabbar .scan-fab svg { width: 17px; height: 17px; }

/* ---------- score ring ---------- */
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); overflow: visible; }
.ring .track { stroke: var(--line); }
.ring .prog {
  stroke: url(#goldGrad);
  stroke-linecap: round;
  filter: drop-shadow(0 0 10px rgba(234, 213, 162, 0.35));
}
.ring .mid {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
}
.ring .val {
  font-family: var(--serif);
  font-size: 52px;
  line-height: 1;
  letter-spacing: -0.02em;
}
.ring .cap { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

/* ---------- bars ---------- */
.bar {
  position: relative;
  height: 6px;
  border-radius: 99px;
  background: var(--surface-2);
  overflow: hidden;
}
.bar > i {
  position: absolute;
  inset: 0;
  width: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--gold-3), var(--gold), #FFF3D6);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 900ms var(--ease);
  will-change: transform;
}
.bar.in > i { transform: scaleX(var(--w, 0)); }
.bar.thin { height: 4px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 2px;
  transition: transform 140ms var(--ease), opacity var(--t-fast) var(--ease);
}
.item:active { transform: scale(0.995); opacity: 0.9; }
.item .ico {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--gold);
}
.item .txt { flex: 1; min-width: 0; }
.item .t { font-size: 14.5px; font-weight: 550; }
.item .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.item .chev { color: var(--faint); flex: 0 0 auto; }

/* ---------- quests ---------- */
.quest {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  transition: opacity var(--t-mid) var(--ease);
}
.quest + .quest { border-top: 1px solid var(--line); }
.quest .tick {
  position: relative;
  flex: 0 0 auto;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center;
  transition: transform 160ms var(--spring), background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.quest .tick svg { width: 14px; height: 14px; opacity: 0; transform: scale(0.4); transition: opacity 160ms var(--ease), transform 220ms var(--spring); }
.quest .tick:active { transform: scale(0.88); }
.quest.done .tick { background: linear-gradient(180deg, #FFF6E2, var(--gold) 60%, var(--gold-2)); border-color: transparent; }
.quest.done .tick svg { opacity: 1; transform: none; color: #171308; }
.quest.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.quest .xp {
  flex: 0 0 auto;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid rgba(234,213,162,0.18);
  padding: 3px 9px;
  border-radius: 99px;
}

/* ---------- week strip ---------- */
.week { display: flex; gap: 8px; }
.day {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 9px 0 8px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  transition: transform 160ms var(--spring), background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.day .d { font-size: 9.5px; letter-spacing: 0.1em; color: var(--muted); }
.day .n { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day .mark { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.day.done .mark { background: var(--gold); box-shadow: 0 0 8px rgba(234,213,162,0.7); }
.day.today {
  background: linear-gradient(180deg, #FFF6E2, var(--gold) 60%, var(--gold-2));
  border-color: transparent;
  color: #171308;
}
.day.today .d, .day.today .n { color: #171308; }
.day.today .mark { background: rgba(23,19,8,0.5); box-shadow: none; }

/* ---------- heatmap ---------- */
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.heat i {
  aspect-ratio: 1;
  border-radius: 5px;
  background: var(--surface-2);
  transform: scale(0.5);
  opacity: 0;
  transition: transform 420ms var(--spring), opacity 300ms var(--ease), background var(--t-fast) var(--ease);
  transition-delay: calc(var(--i, 0) * 9ms);
}
.heat.in i { transform: none; opacity: 1; }
.heat i.l1 { background: rgba(234, 213, 162, 0.22); }
.heat i.l2 { background: rgba(234, 213, 162, 0.45); }
.heat i.l3 { background: rgba(234, 213, 162, 0.72); }
.heat i.l4 { background: var(--gold); }
.heat i.frozen { background: rgba(120, 130, 160, 0.22); }

/* ---------- sparkline ---------- */
.spark { width: 100%; height: 96px; display: block; overflow: visible; }
.spark path.line {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(234,213,162,0.4));
}
.spark path.area { fill: url(#areaGrad); stroke: none; opacity: 0; transition: opacity 700ms var(--ease) 300ms; }
.spark.in path.area { opacity: 1; }
.spark circle { fill: var(--bg); stroke: var(--gold); stroke-width: 2; }

/* ---------- forms ---------- */
.field { display: block; margin-top: 18px; }
.field .lab { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.input {
  width: 100%;
  height: 56px;
  padding: 0 18px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 16px;
  outline: none;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.input:focus { border-color: rgba(234,213,162,0.45); background: var(--surface-2); }
.input::placeholder { color: var(--faint); }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices.one { grid-template-columns: 1fr; }
.choice {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 14px;
  min-height: 96px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: left;
  transition: transform 160ms var(--spring), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  will-change: transform;

.choice:active { transform: scale(0.97); }
.choice .glyph {
  width: 34px; height: 34px; border-radius: 11px;

  background: var(--surface-2); color: var(--gold);
}

.choice .s { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.choice[aria-pressed="true"] {

}
.choice[aria-pressed="true"] .glyph { background: var(--gold); color: #171308; }

  position: absolute; top: 12px; right: 12px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform 200ms var(--spring);
}
.choice .check svg { width: 10px; height: 10px; opacity: 0; transform: scale(0.5); transition: all 180ms var(--spring); color: #171308; }
.choice[aria-pressed="true"] .check { background: var(--gold); border-color: transparent; transform: scale(1.06); }
.choice[aria-pressed="true"] .check svg { opacity: 1; transform: none; }

.steps { display: flex; gap: 5px; margin-top: 4px; }

  overflow: hidden;

}

  content: "";

  background: linear-gradient(90deg, var(--gold-3), var(--gold));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 480ms var(--ease);
}
.steps i.done::after { transform: scaleX(1); }

.cam-wrap {
  position: relative;

  overflow: hidden;
  background: #000;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line);
}

  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: block;
}

.cam-oval {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.cam-oval svg { width: 72%; height: auto; overflow: visible; }

  fill: none;

  position: absolute;

  display: inline-flex; align-items: center; gap: 6px;

.qchip .d { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); transition: background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }

.proc { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 76dvh; gap: 26px; text-align: center; }
.proc .orb { position: relative; width: 148px; height: 148px; }

  position: absolute; inset: 34px;

}

}

  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 10px;

}

  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }

}

  <script>
/* ============================================================
   Lumorph — scoring engine
   Deterministic. On-device. No network, no AI, no cost.

   Input : 478 MediaPipe Face Landmarker points (normalised 0..1)
   Output: pillar scores, sub-metric scores, focus list, quality
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- landmark index constants (canonical MediaPipe mesh) ---------- */
  const L = {
    forehead: 10, chin: 152, nasion: 168, bridge: 6, noseTip: 1, subnasale: 4,
    alaR: 98, alaL: 327,
    faceR: 234, faceL: 454, templeR: 127, templeL: 356,
    gonionR: 172, gonionL: 397, jawR: 132, jawL: 361,
    cheekR: 58, cheekL: 288,
    eyeOutR: 33, eyeInR: 133, eyeInL: 362, eyeOutL: 263,
    lidUpR: 159, lidLoR: 145, lidUpL: 386, lidLoL: 374,
    browPeakR: 105, browPeakL: 334, browOutR: 70, browOutL: 300,
    mouthR: 61, mouthL: 291,
    lipTop: 0, lipUpIn: 13, lipLoIn: 14, lipBottom: 17,
    foreheadMid: 9
  };

  /* ---------- small maths ---------- */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const deg = (r) => (r * 180) / Math.PI;

  function smootherstep(t) {
    t = clamp(t, 0, 1);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  /* A metric scores 10 inside its ideal band and falls away smoothly
     outside it. No cliffs: two nearby measurements give nearby scores. */
  function band(value, lo, hi, falloff) {
    if (value >= lo && value <= hi) return 10;
    const d = value < lo ? lo - value : value - hi;
    const t = d / Math.max(falloff, 1e-6);
    return 10 * (1 - smootherstep(t));
  }

  function round1(v) { return Math.round(v * 10) / 10; }

  /* ---------- geometry helpers (work in pixels) ---------- */
  function makeGeo(lm, w, h) {
    const p = (i) => ({ x: lm[i].x * w, y: lm[i].y * h, z: (lm[i].z || 0) * w });
    const P = {};
    for (const k in L) P[k] = p(L[k]);

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    const eyeMid = { x: (P.eyeOutR.x + P.eyeInR.x + P.eyeInL.x + P.eyeOutL.x) / 4,
                     y: (P.eyeOutR.y + P.eyeInR.y + P.eyeInL.y + P.eyeOutL.y) / 4 };

    // unit vector along the eye line (left -> right in image space)
    const ex = P.eyeOutL.x - P.eyeOutR.x, ey = P.eyeOutL.y - P.eyeOutR.y;
    const elen = Math.hypot(ex, ey) || 1;
    const along = { x: ex / elen, y: ey / elen };            // toward image-left
    const across = { x: -along.y, y: along.x };              // perpendicular (downward)

    const ipd = dist(P.eyeOutR, P.eyeOutL) || 1;
    const faceW = dist(P.faceR, P.faceL) || 1;
    const faceH = dist(P.forehead, P.chin) || 1;

    // signed lateral offset from the facial midline (pixels, + = image left side)
    const lateral = (pt) => {
      const vx = pt.x - eyeMid.x, vy = pt.y - eyeMid.y;
      return vx * along.x + vy * along.y;
    };
    // signed vertical offset along the face axis (+ = toward chin)
    const vertical = (pt) => {
      const vx = pt.x - eyeMid.x, vy = pt.y - eyeMid.y;
      return vx * across.x + vy * across.y;
    };

    const angleAt = (a, b, c) => {
      const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
      const dot = v1.x * v2.x + v1.y * v2.y;
      const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1;
      return deg(Math.acos(clamp(dot / m, -1, 1)));
    };

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    return { P, dist, ipd, faceW, faceH, lateral, vertical, angleAt, mid, eyeMid, along, across };
  }

  /* ---------- raw metrics ---------- */
  function rawMetrics(lm, w, h) {
    const g = makeGeo(lm, w, h);
    const { P, dist, ipd, faceW, faceH, lateral, vertical, angleAt } = g;

    /* 1. symmetry — mirrored pairs should sit equally far from the midline */
    const pairs = [
      [P.eyeOutR, P.eyeOutL], [P.eyeInR, P.eyeInL], [P.mouthR, P.mouthL],
      [P.gonionR, P.gonionL], [P.faceR, P.faceL], [P.cheekR, P.cheekL],
      [P.templeR, P.templeL], [P.browPeakR, P.browPeakL], [P.browOutR, P.browOutL],
      [P.jawR, P.jawL], [P.alaR, P.alaL], [P.lidUpR, P.lidUpL], [P.lidLoR, P.lidLoL]
    ];
    let symSum = 0;
    pairs.forEach(([a, b]) => { symSum += Math.abs(Math.abs(lateral(a)) - Math.abs(lateral(b))); });
    const symmetry = symSum / pairs.length / ipd;

    /* 2. facial thirds */
    const upper = Math.abs(vertical(P.nasion) - vertical(P.forehead));
    const middle = Math.abs(vertical(P.subnasale) - vertical(P.nasion));
    const lower = Math.abs(vertical(P.chin) - vertical(P.subnasale));
    const total = upper + middle + lower || 1;
    const thirds = [upper / total, middle / total, lower / total];
    const thirdsDev = Math.max(...thirds.map((t) => Math.abs(t - 1 / 3)));

    /* 3. facial fifths — the eye band divided into five equal columns */
    const fifth = faceW / 5;
    const eyeOuterW = Math.abs(lateral(P.eyeOutL) - lateral(P.eyeOutR));
    const gap = Math.abs(lateral(P.eyeInL) - lateral(P.eyeInR));
    const fifthsDev = Math.max(
      Math.abs(gap - fifth) / faceW,
      Math.abs((eyeOuterW - gap) / 2 - fifth) / faceW,
      Math.abs((faceW - eyeOuterW) / 2 - fifth) / faceW
    );

    /* 4. proportions */
    const ipdRatio = ipd / faceW;
    const midfaceRatio = ipd / (Math.abs(vertical(P.subnasale) - vertical(P.nasion)) || 1);

    /* 5. eyes */
    const tiltR = deg(Math.atan2(-(P.eyeOutR.y - P.eyeInR.y), Math.abs(P.eyeOutR.x - P.eyeInR.x)));
    const tiltL = deg(Math.atan2(-(P.eyeOutL.y - P.eyeInL.y), Math.abs(P.eyeOutL.x - P.eyeInL.x)));
    const canthalTilt = (tiltR + tiltL) / 2;
    const eyeWR = dist(P.eyeInR, P.eyeOutR) || 1;
    const eyeWL = dist(P.eyeInL, P.eyeOutL) || 1;
    const eyeHR = dist(P.lidUpR, P.lidLoR);
    const eyeHL = dist(P.lidUpL, P.lidLoL);
    const eyeAspect = ((eyeHR / eyeWR) + (eyeHL / eyeWL)) / 2;

    /* 6. nose and lips */
    const noseW = dist(P.alaR, P.alaL) || 1;
    const intercanthal = gap || 1;
    const noseToEyeGap = noseW / intercanthal;
    const philtrum = Math.abs(vertical(P.lipTop) - vertical(P.subnasale));
    const chinH = Math.abs(vertical(P.chin) - vertical(P.lipLoIn));
    const philtrumChin = philtrum / (philtrum + chinH || 1);
    const lipW = dist(P.mouthR, P.mouthL) || 1;
    const lipToNose = lipW / noseW;
    const upperVerm = Math.abs(vertical(P.lipUpIn) - vertical(P.lipTop));
    const lowerVerm = Math.abs(vertical(P.lipBottom) - vertical(P.lipLoIn));
    const vermilionRatio = upperVerm / (lowerVerm || 1);
    const lipFullness = (upperVerm + lowerVerm) / lipW;

    /* 7. jaw and cheek structure */
    const bigonial = dist(P.gonionR, P.gonionL);
    const jawCheek = bigonial / faceW;
    const gonialR = angleAt(P.faceR, P.gonionR, P.chin);
    const gonialL = angleAt(P.faceL, P.gonionL, P.chin);
    const gonialAngle = (gonialR + gonialL) / 2;
    const chinWidth = dist(P.jawR, P.jawL) / faceW;

    /* 8. dimorphism cues */
    const eyeY = (P.lidUpR.y + P.lidUpL.y) / 2;
    const browHeight = (eyeY - (P.browPeakR.y + P.browPeakL.y) / 2) / ipd;
    const midfaceWidth = dist(P.cheekR, P.cheekL) / faceW;

    return {
      symmetry, thirdsDev, fifthsDev, ipdRatio, midfaceRatio, canthalTilt,
      eyeAspect, noseToEyeGap, philtrumChin, lipToNose, vermilionRatio,
      lipFullness, jawCheek, gonialAngle, chinWidth, browHeight, midfaceWidth,
      thirds, _geo: { faceW, faceH, ipd, eyeMid: g.eyeMid }
    };
  }

  /* ---------- skin signals, straight off the pixels ---------- */
  function skinMetrics(img, lm) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const S = 220; // work small, it is a texture measurement not a print
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = Math.round((S * h) / w);
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const data = ctx.getImageData(0, 0, cv.width, cv.height).data;

    const px = (i) => ({ x: lm[i].x * cv.width, y: lm[i].y * cv.height });
    const g = makeGeo(lm, cv.width, cv.height);

    function patch(center, radius) {
      const out = [];
      const r = Math.max(2, Math.round(radius));
      for (let y = -r; y <= r; y++) {
        for (let x = -r; x <= r; x++) {
          if (x * x + y * y > r * r) continue;
          const X = Math.round(center.x + x), Y = Math.round(center.y + y);
          if (X < 0 || Y < 0 || X >= cv.width || Y >= cv.height) continue;
          const o = (Y * cv.width + X) * 4;
          out.push([data[o] / 255, data[o + 1] / 255, data[o + 2] / 255]);
        }
      }
      return out;
    }

    const lum = ([r, gg, b]) => 0.2126 * r + 0.7152 * gg + 0.0722 * b;
    const mean = (a) => a.reduce((s, v) => s + v, 0) / (a.length || 1);
    const std = (a) => {
      const m = mean(a);
      return Math.sqrt(mean(a.map((v) => (v - m) * (v - m))));
    };

    const faceW = g.faceW;
    const rad = faceW * 0.055;

    const cheekR = patch(px(L.cheekR), rad);
    const cheekL = patch(px(L.cheekL), rad);
    const forehead = patch(px(L.foreheadMid), rad);
    const underR = patch(g.mid(px(L.lidLoR), px(L.cheekR)), rad * 0.8);
    const underL = patch(g.mid(px(L.lidLoL), px(L.cheekL)), rad * 0.8);
    const tzone = patch(g.mid(px(L.nasion), px(L.noseTip)), rad * 0.7);

    const all = [...cheekR, ...cheekL, ...forehead];
    if (!all.length) return null;

    const redness = mean(all.map(([r, gg]) => r - gg));
    const evenness = std(all.map(lum));
    const cheekLum = mean([...cheekR, ...cheekL].map(lum));
    const underLum = mean([...underR, ...underL].map(lum));
    const underEye = clamp(cheekLum - underLum, -0.2, 0.4);

    const tzLum = tzone.map(lum).sort((a, b) => a - b);
    const p95 = tzLum.length ? tzLum[Math.floor(tzLum.length * 0.95)] : 0.7;
    const shine = p95;

    // high-frequency energy across the cheeks: a proxy for visible texture
    let energy = 0, n = 0;
    for (const c of [px(L.cheekR), px(L.cheekL)]) {
      const r = Math.round(rad * 1.4);
      for (let y = -r; y < r; y += 2) {
        for (let x = -r; x < r; x += 2) {
          const X = Math.round(c.x + x), Y = Math.round(c.y + y);
          if (X < 1 || Y < 1 || X >= cv.width - 1 || Y >= cv.height - 1) continue;
          const o = (Y * cv.width + X) * 4;
          const oR = (Y * cv.width + X + 1) * 4;
          const oD = ((Y + 1) * cv.width + X) * 4;
          const l0 = lum([data[o] / 255, data[o + 1] / 255, data[o + 2] / 255]);
          const l1 = lum([data[oR] / 255, data[oR + 1] / 255, data[oR + 2] / 255]);
          const l2 = lum([data[oD] / 255, data[oD + 1] / 255, data[oD + 2] / 255]);
          energy += Math.abs(l1 - l0) + Math.abs(l2 - l0);
          n++;
        }
      }
    }
    const texture = n ? energy / n : 0.04;

    return { redness, evenness, underEye, shine, texture };
  }

  /* ---------- the rubric ---------- */
  /* Bands are the first calibration pass. Every number here is meant to be
     tuned against real photos; nothing is hidden from the user. */
  function genderBands(gender) {
    const male = gender === 'male';
    return {
      jawCheek: male ? [0.82, 0.93] : [0.72, 0.85],
      gonial: male ? [116, 136] : [120, 140],
      browHeight: male ? [0.30, 0.44] : [0.34, 0.50],

  }

  const METRICS = [
    { id: 'symmetry', label: 'Symmetry', pillar: 'harmony', fmt: (v) => (v * 100).toFixed(1) + '%',
      score: (v) => band(v, 0, 0.012, 0.085), tip: 'Asymmetry is mostly light and camera angle. Shoot straight-on, at eye level, in even light.' },

      score: (v, b) => band(v, b.gonial[0], b.gonial[1], 14), tip: 'Partly fixed. Chewing hard food and keeping your tongue on the palate is the honest advice.' },

    { id: 'philtrumChin', label: 'Philtrum to chin', pillar: 'features', fmt: (v) => v.toFixed(2),

      score: (v) => band(v, 0.01, 0.10, 0.11), tip: 'Gentle cleanser, no scrubbing, and a barrier moisturiser at night.' },
    { id: 'underEye', label: 'Under-eye shadow', pillar: 'skin', fmt: (v) => (v * 100).toFixed(0) + '%',
      score: (v) => band(v, 0, 0.06, 0.12), tip: 'Sleep is the product. Eight hours beats every under-eye cream on the shelf.' },
    { id: 'shine', label: 'T-zone shine', pillar: 'skin', fmt: (v) => (v * 100).toFixed(0) + '%',
      score: (v) => band(v, 0.50, 0.86, 0.28), tip: 'A light gel moisturiser and blotting beats washing your face five times a day.' },

  const PILLARS = [
    { id: 'harmony', label: 'Harmony', weight: 0.30, blurb: 'How the parts sit together: symmetry, thirds, fifths, spacing.' },
    { id: 'angularity', label: 'Angularity', weight: 0.20, blurb: 'Jaw and chin structure: width, angle, taper.' },
    { id: 'dimorphism', label: 'Dimorphism', weight: 0.15, blurb: 'How strongly your features read as your stated gender.' },
    { id: 'features', label: 'Features', weight: 0.25, blurb: 'Eyes, nose and mouth: tilt, aperture, ratios.' },
    { id: 'skin', label: 'Skin signals', weight: 0.10, blurb: 'Appearance only, read from this photo. Not a measurement.' }
  ];

  /* ---------- the score ---------- */
  function score(metrics, gender) {
    const bands = genderBands(gender);
    const details = [];
    const pillarScores = {};

    METRICS.forEach((m) => {
      const v = metrics[m.id];
      if (v == null || !isFinite(v)) return;
      const s = clamp(m.score(v, bands), 0, 10);
      details.push({
        id: m.id, label: m.label, pillar: m.pillar, value: v,
        valueLabel: m.fmt(v), score: s, tip: m.tip
      });
      (pillarScores[m.pillar] = pillarScores[m.pillar] || []).push(s);
    });

    const pillars = {};
    PILLARS.forEach((p) => {
      const arr = pillarScores[p.id] || [];
      pillars[p.id] = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    });

    let total = 0, wsum = 0;
    PILLARS.forEach((p) => {
      if (pillars[p.id] == null) return;
      total += pillars[p.id] * p.weight;
      wsum += p.weight;
    });
    const overall = wsum ? total / wsum : 0;

    const focus = details
      .slice()
      .sort((a, b) => a.score - b.score)
      .slice(0, 3);

    return {
      overall: round1(overall),
      pillars: Object.fromEntries(Object.entries(pillars).map(([k, v]) => [k, v == null ? null : round1(v)])),
      details,
      focus
    };
  }

  /* ---------- capture quality gates ---------- */
  function quality(lm, w, h, img) {
    if (!lm || !lm.length) {
      return { ok: false, chips: [{ id: 'face', label: 'Face', ok: false }], message: 'No face found. Move closer and fill the oval.' };
    }
    const g = makeGeo(lm, w, h);
    const { P } = g;

    // yaw: nose tip should sit near the eye midpoint laterally
    const yaw = Math.abs(g.lateral(P.noseTip) - g.lateral(g.eyeMid)) / g.ipd;
    // roll: the eye line should be close to level
    const roll = Math.abs(deg(Math.atan2(P.eyeOutL.y - P.eyeOutR.y, P.eyeOutL.x - P.eyeOutR.x)));

    let brightness = 0.6, sharpness = 0.05;
    if (img) {
      const S = 160;
      const cv = document.createElement('canvas');
      cv.width = S; cv.height = Math.round((S * h) / w);
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let sum = 0, e = 0, n = 0;
      for (let y = 1; y < cv.height - 1; y += 2) {
        for (let x = 1; x < cv.width - 1; x += 2) {
          const o = (y * cv.width + x) * 4;
          const l = (0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2]) / 255;
          const oR = (y * cv.width + x + 1) * 4;
          const lR = (0.2126 * d[oR] + 0.7152 * d[oR + 1] + 0.0722 * d[oR + 2]) / 255;
          sum += l; e += Math.abs(lR - l); n++;
        }
      }
      brightness = sum / (n || 1);
      sharpness = e / (n || 1);
    }

    const chips = [
      { id: 'face', label: 'Face', ok: true },
      { id: 'angle', label: 'Angle', ok: yaw < 0.075 && roll < 7 },
      { id: 'light', label: 'Light', ok: brightness > 0.22 && brightness < 0.92 },
      { id: 'focus', label: 'Focus', ok: sharpness > 0.012 }
    ];

    const ok = chips.every((c) => c.ok);
    let message = 'Hold still \u2014 capturing.';
    if (!chips[1].ok) message = roll >= 7 ? 'Level your head.' : 'Turn to face the camera.';
    else if (!chips[2].ok) message = brightness <= 0.22 ? 'Face a light source.' : 'Too bright behind you.';
    else if (!chips[3].ok) message = 'Hold steady \u2014 the frame is soft.';

    return { ok, chips, message, yaw, roll, brightness, sharpness };
  }

  /* ---------- demo landmarks (for previews, and for the offline fallback) ---------- */
  function demoLandmarks(seed) {
    let s = seed || 1;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const j = (v, amt) => v + (rnd() - 0.5) * amt;

    const W = 1000, H = 1333;
    const cx = j(500, 10), ey = j(600, 10);

    const faceHalf = 118 * (1 + (rnd() - 0.5) * 0.07);
    const jawHalf = 105 * (1 + (rnd() - 0.5) * 0.16);
    const eyeSpan = 55 * (1 + (rnd() - 0.5) * 0.10);
    const tilt = (rnd() - 0.5) * 9;
    const lipHalf = 33 * (1 + (rnd() - 0.5) * 0.22);
    const chinHalf = 30 * (1 + (rnd() - 0.5) * 0.18);
    const browDrop = 34 + (rnd() - 0.5) * 10;
    const set = (i, x, y) => { lm[i] = { x: x / W, y: y / H, z: 0 }; };

    set(10, cx, ey - 138);            // forehead (trichion)
    set(9, cx, ey - 112);             // forehead centre
    set(168, cx, ey - 42);            // nasion
    set(6, cx, ey - 80);              // bridge
    set(1, cx, ey + 46);              // nose tip
    set(4, cx, ey + 66);              // subnasale
    set(98, cx - 18, ey + 52);        // ala right
    set(327, cx + 18, ey + 52);       // ala left
    set(234, cx - faceHalf, ey);      // face edge right
    set(454, cx + faceHalf, ey);      // face edge left
    set(127, cx - faceHalf * 0.95, ey - 62);
    set(356, cx + faceHalf * 0.95, ey - 62);
    set(58, cx - faceHalf * 0.76, ey + 30);   // cheek right
    set(288, cx + faceHalf * 0.76, ey + 30);  // cheek left
    set(172, cx - jawHalf, ey + 90);         // gonion right
    set(397, cx + jawHalf, ey + 90);         // gonion left
    set(132, cx - chinHalf, ey + 140);
    set(361, cx + chinHalf, ey + 140);
    set(152, cx, ey + 166);           // chin
    set(33, cx - eyeSpan, ey - 3 - tilt);    // eye outer right
    set(133, cx - 18, ey + 2 + tilt * 0.4);  // eye inner right
    set(362, cx + 18, ey + 2 + tilt * 0.4);  // eye inner left
    set(263, cx + eyeSpan, ey - 3 - tilt);   // eye outer left
    set(159, cx - 36, ey - 6); set(145, cx - 36, ey + 6);
    set(386, cx + 36, ey - 6); set(374, cx + 36, ey + 6);
    set(105, cx - 40, ey - browDrop); set(334, cx + 40, ey - browDrop);
    set(70, cx - 62, ey - browDrop + 6); set(300, cx + 62, ey - browDrop + 6);
    set(61, cx - lipHalf, ey + 95);          // mouth corner right
    set(291, cx + lipHalf, ey + 95);         // mouth corner left
    set(0, cx, ey + 89);
    set(13, cx, ey + 96);
    set(14, cx, ey + 107);
    set(17, cx, ey + 115);

    for (let i = 0; i < 478; i++) {
      if (lm[i].x === 0.5 && lm[i].y === 0.5) {
        lm[i] = { x: 0.5 + (rnd() - 0.5) * 0.14, y: 0.45 + (rnd() - 0.5) * 0.30, z: 0 };
      }
    }
    return lm;
  }

  /* ---------- public ---------- */
  global.LumorphEngine = {
    METRICS, PILLARS, L,
    rawMetrics, skinMetrics, score, quality, demoLandmarks,
    band, makeGeo
  };
})(window);

  function heatmap() {
    const cells = [];
    const today = new Date();
    const start = new Date(today);
    start.setDate(today.getDate() - 34);
    for (let i = 0; i < 35; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const k = todayKey(d);
      const q = S.quests[k] || {};
      const done = Object.values(q).filter(Boolean).length;
      let cls = '';
      if (d > today) cls = '';
      else if (done === 0) cls = 'frozen';
      else cls = 'l' + Math.min(4, Math.ceil(done / 2));
      cells.push(h('i', { class: cls, style: { '--i': i }, title: k }));
    }
    const el = h('div', { class: 'heat' }, cells);
    raf(() => raf(() => el.classList.add('in')));
    return el;

  function sparkline(vals) {
    const w = 300, hgt = 96, pad = 8;
    const min = Math.min(...vals) - 0.6, max = Math.max(...vals) + 0.6;
    const x = (i) => pad + (i / Math.max(1, vals.length - 1)) * (w - pad * 2);
    const y = (v) => pad + (1 - (v - min) / (max - min || 1)) * (hgt - pad * 2);
    const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const area = d + ` L${x(vals.length - 1).toFixed(1)} ${hgt} L${x(0).toFixed(1)} ${hgt} Z`;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'spark');
    svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
    svg.innerHTML = `<path class="area" d="${area}"/><path class="line" d="${d}"/>` +
      vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === vals.length - 1 ? 4 : 2.4}"/>`).join('');
    const path = svg.querySelector('.line');
    let len = 600;
    try { len = path.getTotalLength() || 600; } catch (e) { /* detached svg */ }
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    raf(() => raf(() => {
      path.style.transition = 'stroke-dashoffset 1200ms cubic-bezier(.22,1,.36,1)';
      path.style.strokeDashoffset = 0;
      svg.classList.add('in');
    }));
    return h('div', { style: { marginTop: '14px' } }, svg);
  }

  /* ---------- ring ---------- */
  function ring(size, score, delay) {
    const r = size / 2 - 6;
    const c = 2 * Math.PI * r;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.innerHTML =
      `<circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="5"/>` +
      `<circle class="prog" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="5" r="${r}"/>`;
    const prog = svg.querySelector('.prog');
    prog.style.strokeDasharray = c;
    prog.style.strokeDashoffset = c;
    setTimeout(() => animateRing(prog, Math.max(0, Math.min(1, score / 10))), delay || 60);
    const val = h('div', { class: 'val', style: { fontSize: Math.round(size * 0.32) + 'px' } }, '0.0');
    setTimeout(() => animateNumber(val, score, { dp: 1, dur: 1000 }), delay || 60);
    return h('div', { class: 'ring', style: { width: size + 'px', height: size + 'px' } }, svg,
      h('div', { class: 'mid' }, val, size > 90 ? h('div', { class: 'cap' }, 'out of 10') : null));
  }

  async function ensureLandmarker() {
    if (cam.lmReady) return cam.lmReady;
    cam.lmReady = (async () => {
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const fileset = await vision.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      return vision.FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1
      });
    })();
    return cam.lmReady;
  }

  ROUTES.scan = function (root) {
    const demo = /demo=1/.test(location.search);
    const video = h('video', { playsinline: true, autoplay: true, muted: true });
    const oval = h('div', { class: 'cam-oval' },
      h('div', { html: `<svg viewBox="0 0 200 280"><ellipse class="guide" cx="100" cy="140" rx="62" ry="96"/></svg>` }));
    const hint = h('div', { class: 'cam-hint' }, 'Starting camera\u2026');
    const chips = h('div', { class: 'cam-chips' });
    const wrap = h('div', { class: 'cam-wrap' }, video, oval, hint);
    const fileInput = h('input', { type: 'file', accept: 'image/*', class: 'hide' });

    const captureBtn = h('button', { class: 'btn primary mt-16', disabled: true, onclick: () => capture() },
      h('span', { html: I.camera, style: { width: '18px', height: '18px', display: 'grid' } }), 'Capture');

    root.append(
      h('div', { class: 'rise', style: { '--i': 0 } },
        h('div', { class: 'row between', style: { paddingTop: '6px', marginBottom: '14px' } },
          h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: () => go(lastScan() ? 'home' : 'onboarding') },
            h('span', { html: I.close, style: { display: 'grid', width: '18px', height: '18px' } })),
          h('button', { class: 'btn small ghost', onclick: () => fileInput.click() },
            h('span', { html: I.upload, style: { width: '16px', height: '16px', display: 'grid' } }), 'Upload'))),
      h('div', { class: 'rise', style: { '--i': 1 } },
        h('p', { class: 'eyebrow' }, 'New scan'),
        h('h1', { class: 'display md', style: { marginTop: '4px' } }, 'Fill the oval, ', h('em', {}, 'look straight'), '.')),
      wrap, chips, captureBtn, fileInput,
      h('p', { class: 'tiny center mt-16 rise', style: { '--i': 3 } },
        'Measured in this tab. Nothing is uploaded. Photos are kept in your browser so your history works offline.')
    );

    async function boot() {
      if (demo) { hint.textContent = 'Preview mode \u2014 using a sample face'; captureBtn.disabled = false; return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } }, audio: false
        });
        cam.stream = stream;
        cam.active = true;
        video.srcObject = stream;
        await video.play();
        hint.textContent = 'Line your face up with the oval';
        const lm = await ensureLandmarker();
        const tick = () => {
          if (!cam.active) return;
          const now = performance.now();
          if (now - cam.last > 90 && video.readyState >= 2) {
            cam.last = now;
            try {
              const res = lm.detectForVideo(video, now);
              cam.lm = res.faceLandmarks && res.faceLandmarks[0] ? res.faceLandmarks[0] : null;
              updateLive();
            } catch (e) { /* skip a frame */ }
          }
          cam.raf = requestAnimationFrame(tick);
        };
        tick();
      } catch (err) {
        cam.err = err;
        hint.textContent = err && err.name === 'NotAllowedError'
          ? 'Camera permission denied \u2014 upload a photo instead'
          : 'No camera here \u2014 upload a photo instead';
        captureBtn.disabled = true;
        chips.innerHTML = '';
        chips.append(h('span', { class: 'qchip' }, 'Use Upload above'));
      }
    }

    function updateLive() {
      const vw = video.videoWidth || 1080, vh = video.videoHeight || 1440;

      chips.innerHTML = '';

      h('p', { class: 'eyebrow mt-28 rise', style: { '--i': 1 } }, 'Appearance'),
      h('div', { class: 'card mt-12 rise', style: { '--i': 2 } },
        h('div', { class: 'segmented no-thumb' }, themes.map(([id, label, icon]) =>
          h('button', {
            'aria-selected': String(S.theme === id),
            onclick: () => { S.theme = id; save(); applyTheme(); go('settings'); }
          }, label)))),

      h('p', { class: 'eyebrow mt-20 rise', style: { '--i': 3 } }, 'Data & account'),
      h('div', { class: 'card mt-12 rise', style: { '--i': 4 } },
        linkRow('Export everything as JSON', 'Every scan, measurement and quest', I.download, exportData),
        linkRow('Delete all data', 'Wipes this browser clean', I.trash, confirmWipe)),

      h('p', { class: 'eyebrow mt-20 rise', style: { '--i': 5 } }, 'About'),
      h('div', { class: 'card mt-12 rise', style: { '--i': 6 } },
        linkRow('How scores work', 'The rubric and its limits', I.info, () => go('how')),
        linkRow('Privacy', 'What is stored and where', I.shield, () => openSheet(privacySheet()))),
      h('p', { class: 'tiny center mt-20 rise', style: { '--i': 7 } }, 'Lumorph v1 \u00b7 free, offline, no accounts')
    );
  };

  function privacySheet() {
    return h('div', {},
      h('h2', { class: 'display sm' }, 'Privacy'),
      h('p', { class: 'small mt-12' }, 'Lumorph has no server. Your photos, measurements, quests and scores are stored in this browser\u2019s local storage on this device. Nothing is uploaded, transmitted, sold or shared, because there is nowhere for it to go.'),
      h('p', { class: 'small mt-12' }, 'Clearing your browser data, or using Delete all data, removes everything permanently. Export first if you want a copy.'),
      h('p', { class: 'small mt-12' }, 'Face detection runs through MediaPipe, downloaded once from a public CDN and executed locally. Face recognition and face classification are not used \u2014 only landmark positions.'),
      h('button', { class: 'btn primary mt-20', onclick: closeSheet }, 'Got it'));
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'lumorph-export-' + todayKey() + '.json' });
    document.body.append(a); a.click(); a.remove();
    toast('Exported');
  }
  function confirmWipe() {
    openSheet(h('div', {},
      h('h2', { class: 'display sm' }, 'Delete everything?'),
      h('p', { class: 'small mt-12' }, 'This removes every scan, photo and quest from this browser. It cannot be undone.'),
      h('div', { class: 'row gap-10 mt-20' },
        h('button', { class: 'btn ghost', onclick: closeSheet }, 'Keep it'),
        h('button', { class: 'btn danger', onclick: () => {
          localStorage.removeItem(KEY);
          S = blank();
          closeSheet();
          onb = null;
          go('onboarding');
          toast('Everything deleted');
        } }, 'Delete'))));
  }

  /* ---------- how scores work ---------- */
  ROUTES.how = function (root) {
    root.append(
      h('div', { class: 'rise', style: { '--i': 0 } },
        h('div', { class: 'row', style: { paddingTop: '6px', marginBottom: '14px' } },
          h('button', { class: 'icon-btn', 'aria-label': 'Back', onclick: () => go('profile') },
            h('span', { html: I.back, style: { display: 'grid', width: '18px', height: '18px' } }))),
        h('p', { class: 'eyebrow' }, 'Transparency'),
        h('h1', { class: 'display lg', style: { marginTop: '6px' } }, 'How we calculate ', h('em', {}, 'your scores')),
        h('p', { class: 'lede' }, 'No black box. Here is every input, every weight, and what the number cannot tell you.')),

      h('div', { class: 'card mt-20 rise', style: { '--i': 1 } },
        h('div', { class: 'eyebrow' }, 'The pipeline'),
        [
          ['Landmarks', 'MediaPipe finds 478 points on your face, on this device. The points are never uploaded.'],
          ['Measurements', 'Those points become 22 ratios and angles: symmetry, thirds, jaw width, canthal tilt, lip ratios and so on.'],
          ['Scoring', 'Each measurement scores 10 inside its ideal band and falls away smoothly outside it. No cliffs, no randomness.'],
          ['Pillars', 'Measurements average into five pillars, then into one overall score out of ten.'],
          ['Skin', 'Five appearance signals read from the pixels of the photo itself: tone variance, redness, under-eye contrast, shine, texture.']
        ].map(([t, s], i) => h('div', { class: 'row gap-12', style: { padding: '12px 0', borderTop: i ? '1px solid var(--line)' : 'none' } },
          h('div', { class: 'pill gold', style: { width: '26px', height: '26px', padding: '0', justifyContent: 'center', flex: '0 0 auto' } }, String(i + 1)),
          h('div', {}, h('div', { style: { fontSize: '14px', fontWeight: '600' } }, t), h('div', { class: 'small' }, s))))),

      h('div', { class: 'card mt-16 rise', style: { '--i': 2 } },
        h('div', { class: 'eyebrow', style: { marginBottom: '10px' } }, 'Weights'),
        E.PILLARS.map((p) => h('div', { class: 'row between', style: { padding: '9px 0', borderTop: '1px solid var(--line)' } },
          h('div', {}, h('div', { style: { fontSize: '13.5px', fontWeight: '600' } }, p.label), h('div', { class: 'tiny' }, p.blurb)),
          h('span', { class: 'display sm mono', style: { color: 'var(--gold)' } }, Math.round(p.weight * 100) + '%')))),

      h('div', { class: 'card mt-16 rise', style: { '--i': 3 } },
        h('div', { class: 'row gap-10', style: { marginBottom: '8px' } },
          h('span', { html: I.shield, style: { width: '18px', height: '18px', color: 'var(--gold)', display: 'grid' } }),
          h('span', { style: { fontWeight: '600', fontSize: '13.5px' } }, 'What this is not')),
        h('p', { class: 'small' }, 'It is not a measurement of attractiveness, and it is not a medical device. It reads geometry from one photo in one moment. Light, lens, angle and expression all move the number. Use it as a trend line against your own past scans, never as a verdict.'),
        h('p', { class: 'small mt-12' }, 'It does not diagnose, treat or screen for any condition, and it must not be used to check for acne, moles or anything else. See a dermatologist for that.')),

      h('button', { class: 'btn ghost mt-20 rise', style: { '--i': 4 }, onclick: () => go('home') }, 'Back to home')
    );
  };

  /* ---------------- theme ---------------- */
  function applyTheme() {
    const t = S.theme === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : S.theme;
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#F6F3EC' : '#07070A');
  }

  /* ---------------- demo seed ---------------- */
  function seedDemo() {
    S = blank();
    S.onboarded = true;
    S.profile = { name: 'Soham', gender: 'male', birth: '2001-11-18', height: 178, skin: ['balanced', 'oily'], concerns: ['clarity', 'definition', 'eyes'] };
    S.consent = { type: 'local-analysis', at: Date.now() };
    S.theme = 'dark';
    const targets = [6.4, 6.7, 6.6, 7.1, 7.3, 7.2, 7.6, 7.8];
    const now = Date.now();
    targets.forEach((target, i) => {
      const lm = E.demoLandmarks(1000 + i * 37);
      const m = E.rawMetrics(lm, 1080, 1440);
      const base = E.score(m, 'male');
      const shift = target - base.overall;
      const pillars = {};
      E.PILLARS.forEach((p) => {
        const v = base.pillars[p.id];
        pillars[p.id] = v == null ? null : Math.max(1, Math.min(10, Math.round((v + shift * 0.9) * 10) / 10));
      });
      const details = base.details.map((d) => ({
        ...d, score: Math.max(1, Math.min(10, Math.round((d.score + shift) * 10) / 10))
      }));
      // synthetic skin signals: demo faces have no pixels to read
      const skinSeeds = [
        ['evenness', 'Tone evenness', '6% var'], ['redness', 'Redness', '7%'],
        ['underEye', 'Under-eye shadow', '4%'], ['shine', 'T-zone shine', '64%'],
        ['texture', 'Texture', '0.031']
      ];
      skinSeeds.forEach(([id, label, valueLabel], k) => {
        details.push({
          id, label, pillar: 'skin', value: 0, valueLabel,
          score: Math.max(1, Math.min(10, Math.round((target - 0.6 + (k % 3) * 0.5) * 10) / 10)),
          tip: 'Consistency beats intensity: the same simple routine for sixty days.'
        });
      });
      pillars.skin = Math.round((target - 0.4) * 10) / 10;
      S.scans.push({
        id: 'demo' + i, ts: now - (targets.length - i) * 6 * 86400000,
        overall: target, pillars, details,
        focus: details.slice().sort((a, b) => a.score - b.score).slice(0, 3),
        metrics: m, quality: { ok: true, chips: [] }, thumb: null
      });
    });
    S._open = S.scans[S.scans.length - 1].id;
    // quest history so streaks and the heatmap have something to show
    for (let i = 1; i < 26; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      if (i % 7 === 0) continue;
      const k = todayKey(d);
      const n = (i * 7) % 5;
      S.quests[k] = {};
      QUESTS.slice(0, n).forEach((q) => { S.quests[k][q.id] = true; });
    }
    S.quests[todayKey()] = { am: true, water: true };
    S.xp = 1180;
    save();
  }

  /* ---------------- boot ---------------- */
  load();
  const themeParam = (location.search.match(/theme=(dark|light|system)/) || [])[1];
  if (themeParam) S.theme = themeParam;
  applyTheme();
  if (/demo=1/.test(location.search)) seedDemo();

  const startRoute = (location.hash || '').replace('#/', '') || (S.onboarded ? 'home' : 'onboarding');
  if (!S.onboarded) {
    paint('onboarding');
  } else {
    paint(ROUTES[startRoute] ? startRoute : 'home');
  }
  history.replaceState({ r: S.onboarded ? (ROUTES[startRoute] ? startRoute : 'home') : 'onboarding' }, '', location.href);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();

</script>
</body>
</html>
